<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <title>My Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #bio {
        font-style: italic;
    }
    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }
  </style>
</head>
<body class="bg-gradient-to-r from-purple-900 via-indigo-900 to-black text-white min-h-screen flex flex-col font-sans">

  <nav class="backdrop-blur-md bg-white/10 fixed w-full z-30 shadow-lg">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
      <a href="#" class="text-2xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-red-500 to-yellow-400 hover:brightness-110 transition">Mark's Portfolio</a>
      <div class="space-x-6 hidden md:flex">
        <a href="#about" class="hover:text-pink-400 transition">About</a>
        <a href="#skills" class="hover:text-pink-400 transition">Skills</a>
        <a href="#quote" class="hover:text-pink-400 transition">Quote</a>
      </div>
    </div>
  </nav>

  <main class="flex-grow pt-24 container mx-auto px-6">

    <section id="about" class="max-w-5xl mx-auto bg-gradient-to-r from-purple-800 via-indigo-800 to-indigo-900 rounded-3xl shadow-2xl p-10 md:flex md:items-center md:space-x-12">

      <div class="mb-8 md:mb-0 flex justify-center">
        <img 
          src="makiprofile.jpg" 
          alt="Mark Vencent L. Juntilla" 
          class="rounded-full border-4 border-pink-500 shadow-xl w-44 h-44 object-cover transition-transform hover:scale-105 duration-300" 
          loading="lazy" />
      </div>

      <div>
        <h1 id="fullname" class="text-5xl font-extrabold mb-3 bg-gradient-to-r from-pink-400 via-red-500 to-yellow-400 bg-clip-text text-transparent"></h1>
        <h2 id="course_year" class="text-xl font-semibold mb-6 text-pink-300"></h2>
        <p id="bio" class="text-lg leading-relaxed max-w-xl mb-8 text-gray-300"></p>

        <h3 class="text-2xl font-bold mb-2 text-pink-400">My Goal After Graduation</h3>
        <p id="goal" class="text-gray-300 text-lg"></p>
      </div>
    </section>

    <section id="skills" class="max-w-5xl mx-auto mt-16 p-10 bg-gradient-to-r from-indigo-900 via-purple-900 to-pink-900 rounded-3xl shadow-2xl text-white">
      <h2 class="text-4xl font-extrabold mb-8 bg-gradient-to-r from-pink-400 via-red-500 to-yellow-400 bg-clip-text text-transparent text-center">
        Skills
      </h2>
      <ul class="grid grid-cols-5 gap-8 text-center">
        <li id="skill1" class="py-4 px-6 rounded-lg bg-gradient-to-tr from-pink-500 via-red-500 to-yellow-400 font-semibold shadow-lg hover:scale-105 transform transition">Java</li>
        <li id="skill2" class="py-4 px-6 rounded-lg bg-gradient-to-tr from-pink-500 via-red-500 to-yellow-400 font-semibold shadow-lg hover:scale-105 transform transition">C#</li>
        <li id="skill3" class="py-4 px-6 rounded-lg bg-gradient-to-tr from-pink-500 via-red-500 to-yellow-400 font-semibold shadow-lg hover:scale-105 transform transition">Laravel</li>
        <li id="skill4" class="py-4 px-6 rounded-lg bg-gradient-to-tr from-pink-500 via-red-500 to-yellow-400 font-semibold shadow-lg hover:scale-105 transform transition">Database Management</li>
        <li id="skill5" class="py-4 px-6 rounded-lg bg-gradient-to-tr from-pink-500 via-red-500 to-yellow-400 font-semibold shadow-lg hover:scale-105 transform transition">HTML / CSS / JavaScript</li>
      </ul>
    </section>

    <section id="quote" class="max-w-5xl mx-auto mt-16 p-10 bg-gradient-to-r from-pink-900 via-purple-900 to-indigo-900 rounded-3xl shadow-2xl text-pink-400 italic text-center text-2xl font-semibold tracking-wide select-text">
      <h2 class="text-4xl font-extrabold mb-8 bg-gradient-to-r from-pink-400 via-red-500 to-yellow-400 bg-clip-text text-transparent text-center">Favourite Quote</h2>
      <blockquote id="main-quote" class="max-w-3xl mx-auto"></blockquote>
      <br>
      <br>
      <h2 class="text-4xl font-extrabold mb-8 bg-gradient-to-r from-pink-400 via-red-500 to-yellow-400 bg-clip-text text-transparent text-center">Inspirational Quote</h2>
      <blockquote id="inspirational-quote" class="max-w-3xl mx-auto"></blockquote>
    </section>

  </main>

  <footer class="bg-gradient-to-r from-purple-900 via-indigo-900 to-black text-gray-400 text-center py-6 mt-16 select-none space-x-4">
      <a href="https://www.facebook.com/facon.titan/" target="_blank" class="hover:text-pink-400 transition">
        <i class="fab fa-facebook-f"></i>
      </a>
      <a href="mailto:juntillakingmaki@gmail.com" class="hover:text-pink-400 transition">
        <i class="fas fa-envelope"></i>
      </a>
  </footer>


  <script>
    document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("fullname").innerText = "Mark Vencent L. Juntilla";
    document.getElementById("course_year").innerText = "3rd Year Bachelor of Science in Information Technology";
    document.getElementById("bio").innerText = `"A busy mind with a purpose."`;
    document.getElementById("goal").innerText = "My goal after I graduate is to have a stable job related to the degree i am pursuing.";
    document.getElementById("main-quote").innerText = "“Tough times don’t last. Tough people do.”";
    document.getElementById("inspirational-quote").innerText = "“Quiet minds often have the loudest souls — it just takes the right person to hear them.”";
    });
  </script>

</body>
</html>
